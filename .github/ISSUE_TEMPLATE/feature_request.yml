name: Feature request
description: Suggest a snippet improvement or a new host (VS Code, Windsurf, …)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or incorrect today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should BiDiSense do instead?
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Cursor
        - VS Code
        - Other / new host
    validations:
      required: true
